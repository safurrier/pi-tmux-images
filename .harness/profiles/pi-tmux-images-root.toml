name = "pi-tmux-images-root"
title = "Pi tmux images"
target_hint = "Use --target . from this repository."
summary = "Local Pi image-preview extension and release-package validation profile."
instructions = "Run focused Node tests while editing, then mise run check, mise run verify, and HK config validation. Release-tooling changes must also cover the dry-run/fail-closed contract."
[[checks]]
name = "check"
purpose = "Type, lint, unit, release-contract, and package-boundary gate."
command_template = "mise run check"
run_from = "repo-root"
required_when = ["src/**", "extensions/**", "tests/**", "scripts/**", "assets/**", ".github/**", "README.md", "RELEASING.md", "package.json", "package-lock.json"]
[[checks]]
name = "verify"
purpose = "Full gate including packed-package and raw ANSI tmux smoke."
command_template = "mise run verify"
run_from = "repo-root"
required_when = ["src/**", "extensions/**", "tests/**", "scripts/**", "assets/**", ".github/**", "README.md", "RELEASING.md", "package.json", "package-lock.json"]
