name = "pi-inline-images-root"
title = "Pi inline images"
target_hint = "Use --target . from this repository."
summary = "Local Pi image-preview extension validation profile."
instructions = "Run focused Node tests while editing, then mise run check, mise run verify, and HK config validation."
[[checks]]
name = "check"
purpose = "Type, lint, test, and package boundary gate."
command_template = "mise run check"
run_from = "repo-root"
required_when = ["src/**", "extensions/**", "tests/**", "package.json"]
[[checks]]
name = "verify"
purpose = "Full gate including raw ANSI smoke."
command_template = "mise run verify"
run_from = "repo-root"
required_when = ["src/**", "extensions/**", "tests/**"]
